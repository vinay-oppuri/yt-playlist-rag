services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: yt-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web UI Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    profiles:
      - full

